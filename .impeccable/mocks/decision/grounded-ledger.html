<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:390px;height:844px;overflow:hidden}
  body{font-family:'Noto Sans KR',sans-serif;background:#f4efe2;color:#2a2622;padding:18px 16px 0}
  .mono{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums}
  .top{display:flex;align-items:baseline;justify-content:space-between;
       border-bottom:3px double #2a2622;padding-bottom:10px}
  .top .n{font-family:'Roboto Mono',monospace;font-size:38px;font-weight:700;color:#b23b32}
  .top .c{font-size:12px;color:#6b6456;text-align:right}
  .cap{font-size:12px;letter-spacing:.14em;color:#2f5aa0;font-weight:700;margin:16px 0 6px}
  /* 원장 테이블 (표준 테이블 + 원장 규율) */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;color:#6b6456;text-align:right;padding:6px 4px;border-bottom:2px solid #2f5aa0;font-weight:600}
  th.l{text-align:left}
  td{padding:9px 4px;border-bottom:1px solid #ddd3bf;text-align:right}
  td.l{text-align:left}
  td.num{font-family:'Roboto Mono',monospace;font-weight:500}
  td.sp{color:#b23b32;font-weight:700}
  tr.sum td{border-top:2px solid #2a2622;border-bottom:0;font-weight:700;padding-top:10px}
  tr.sum td.bal{color:#2f5aa0}
  /* 체크 + 도장 */
  .ck{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #ddd3bf;font-size:13px}
  .stamp{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;
         justify-content:center;font-size:10px;font-weight:700;transform:rotate(-12deg)}
  .stamp.done{border:2px solid #b23b32;color:#b23b32}
  .stamp.plan{border:2px dashed #9a927f;color:#9a927f}
  .ck .amt{margin-left:auto;font-family:'Roboto Mono',monospace;font-weight:600}
  .tab{position:absolute;bottom:0;left:0;right:0;height:60px;background:#f4efe2;
       border-top:2px solid #2a2622;display:flex}
  .tab a{flex:1;text-align:center;font-size:10px;color:#9a927f;padding-top:11px}
  .tab a .i{display:block;width:20px;height:20px;border-radius:4px;background:#e2d8c4;margin:0 auto 4px}
  .tab a.on{color:#b23b32}
  .tab a.on .i{background:#b23b32}
</style></head>
<body>
  <div class="top">
    <div><div style="font-size:11px;letter-spacing:.2em;color:#6b6456">D-DAY</div>
      <div class="n">198</div></div>
    <div class="c">지훈 &amp; 예은 · 예시<br>2027. 5. 15 (토)</div>
  </div>

  <div class="cap">예산 원장 (만원)</div>
  <table>
    <tr><th class="l">항목</th><th>예산</th><th>지출</th><th>잔액</th></tr>
    <tr><td class="l">웨딩홀</td><td class="num">1,500</td><td class="num sp">900</td><td class="num">600</td></tr>
    <tr><td class="l">스드메</td><td class="num">1,200</td><td class="num sp">430</td><td class="num">770</td></tr>
    <tr><td class="l">예물·예단</td><td class="num">800</td><td class="num sp">500</td><td class="num">300</td></tr>
    <tr><td class="l">신혼여행</td><td class="num">700</td><td class="num sp">300</td><td class="num">400</td></tr>
    <tr class="sum"><td class="l">합계</td><td class="num">5,000</td><td class="num sp">2,130</td><td class="num bal">2,870</td></tr>
  </table>

  <div class="cap">다음 할 일</div>
  <div class="ck"><span class="stamp done">완료</span>웨딩홀 계약금<span class="amt">-900</span></div>
  <div class="ck"><span class="stamp plan">예정</span>스드메 계약<span class="amt">-430</span></div>
  <div class="ck"><span class="stamp plan">예정</span>청첩장 제작<span class="amt">-30</span></div>

  <div class="tab">
    <a class="on"><span class="i"></span>홈</a>
    <a><span class="i"></span>일정</a>
    <a><span class="i"></span>체크</a>
    <a><span class="i"></span>비용</a>
    <a><span class="i"></span>더보기</a>
  </div>
</body></html>
